# Bereiche der Übersichtsseite – Reihenfolge hier = Reihenfolge auf der Seite.
# farbe: hellgruen, orange oder dunkelgruen (Farbstreifen, Etikett und Sprungmarke)
# inhalte: in dieser Reihenfolge erscheinen die Karten. Möglich sind:
#   - handout: <ordner>        z. B. ki-arbeitsprofile oder registrierung (Gruppe mit gruppe.yml)
#     kurz: …                  Kartentext, höchstens 3 Zeilen (ca. 100 Zeichen); sonst die beschreibung des Handouts
#     titel: …                 kürzerer Kartentitel (optional); sonst der Titel des Handouts
#   - werkzeug: <titel>        Titel genau wie in werkzeuge.yml (kurz: wie oben)
#   - extern: <titel>          Karte mit Link auf eine andere Seite (z. B. juliajunge.de), ohne PDF
#     link: https://…
#     knopf: Zur Anleitung     (optional, sonst „Zur Seite“)
#     etikett: Blog und Webinar (optional, kleines Etikett über dem Titel)
#     beschreibung: …          (optional)
#   - kurs: "<titel>"          breite Werbekarte mit Bild (Bild liegt in vorlage/bilder/), Anführungszeichen wegen Doppelpunkt
#     etikett, bild, bild_alt, link, knopf, beschreibung, hinweis (Kleingedrucktes), mehr_link, mehr_knopf
#   - demnaechst: <titel>      Karte „In Arbeit“ ohne Link – einfach löschen, sobald das Handout da ist
#     beschreibung: …          (optional)
# Handouts, die hier fehlen, landen automatisch unten unter „Weitere Handouts“.

- id: starten
  titel: Starten mit KI
  beschreibung: Konto anlegen, Datenschutz einstellen, Ergebnisse prüfen, die ersten guten Prompts schreiben.
  farbe: hellgruen
  inhalte:
    - handout: registrierung
      kurz: Schritt für Schritt zum Gratis-Konto – mit den wichtigsten Datenschutz-Einstellungen.
    - handout: ki-training-abschalten
      titel: KI-Training abschalten
      kurz: Klickpfade für ChatGPT, Claude, Mistral und Gemini – kein Training mit deinen Chats.
    - handout: warum-ki-halluziniert
      kurz: Warum Sprachmodelle Antworten erfinden, nicht neutral sind und was dagegen hilft.
    - handout: bessere-prompts-mit-klaro
      kurz: Fünf Elemente für klare, strukturierte Prompts – mit Tipps und zwei Experimenten.
    - handout: custom-instructions
      kurz: Einmal vorstellen, dauerhaft verstanden werden – mit Leitfragen und Interview-Prompt.
    - handout: gratis-text-tools
      kurz: Die bekanntesten KI-Allrounder im Vergleich – mit Hinweisen zum Datenschutz.
    - kurs: "Modul 1 – Grundlagen: KI verstehen"
      etikett: Gratis-Videokurs
      bild: kurs-modul-1.jpg
      bild_alt: Julia Junge winkt in die Kamera, daneben der Drache mit Fernglas
      link: https://www.juliajunge.de/modul-1-grundlagen-ki-verstehen/
      knopf: Modul 1 gratis ansehen
      beschreibung: Warum halluziniert ChatGPT, woher kommen seine Vorurteile und wie verlässlich sind die Antworten?
      hinweis: Modul 1 gehört zum KI-Selbstlernkurs für NGOs mit 6 Modulen von den Grundlagen, über Prompting, Personalisierung, Tools bis zu Ethik und Recht. Ab Modul 2 kostenpflichtig.
      mehr_link: https://www.juliajunge.de/ki-selbstlernkurs2026/
      mehr_knopf: Zum ganzen Kurs

- id: fortgeschrittene
  titel: Für Fortgeschrittene
  beschreibung: Wiederkehrende Aufgaben abgeben, neue Formate ausprobieren und die passende Plattform finden.
  farbe: orange
  inhalte:
    - handout: ki-arbeitsprofile
      kurz: Assistenzen, Skills und Co. – wie du KI für wiederkehrende Aufgaben einrichtest.
    - extern: Mini-Lernkurs Agentische KI
      etikett: Mini-Lernkurs
      link: https://www.juliajunge.de/mini-lernkurs-agentische-ki/
      knopf: Zum Mini-Lernkurs
      beschreibung: Was agentische KI ist, was sie kann und welche Risiken sie birgt.
    - handout: bessere-bilder-mit-ki
      kurz: Welche Bild-Tools wofür taugen, wie Infografiken gelingen und wann du KI-Bilder kennzeichnen musst.
    - extern: Präsentationen mit KI erstellen
      etikett: Blog und Webinar
      link: https://www.juliajunge.de/praesentationen-mit-ki-erstellen/
      knopf: Zu Beitrag und Webinar
      beschreibung: Von der Idee bis zur Folie – wo KI hilft und wo du selbst entscheiden musst.
    - extern: Tool-Liste
      etikett: Padlet
      link: https://padlet.com/juliajunge/tools-tools-tools-und-alle-mit-ki-81srx41p3gtw5w31
      knopf: Zur Tool-Liste
      beschreibung: Tools, Tools, Tools – und alle mit KI. Meine Sammlung zum Stöbern und Ausprobieren.
    - extern: Reseller-Liste
      link: https://www.juliajunge.de/go/reseller
      knopf: Zur Liste
      beschreibung: Deutsche KI-Plattformen mit Auftragsverarbeitungsvertrag für den Einsatz im Team.

- id: organisationen
  titel: Für Organisationen
  beschreibung: KI im Verein oder in der NGO einführen – mit Standortbestimmung, Fahrplan und Regeln.
  farbe: dunkelgruen
  inhalte:
    - werkzeug: KI-Standortbestimmung
      kurz: 15 Fragen, etwa 7 Minuten – wo steht eure Organisation bei KI? Mit Auswertung und nächsten Schritten.
    - handout: ki-reifegradmodell
      kurz: Fünf Reifegrade in neun Kategorien – zum Ankreuzen, wo deine Organisation steht.
    - handout: leitfaden-ki-einfuehrung
      kurz: In drei Phasen und sieben Schritten KI in NGOs einführen – mit Checklisten und Fragen.
    - handout: leitlinien-ki-nutzung
      kurz: Frei kopierbare Vorlage für KI-Leitlinien in Vereinen (Version 5, mit Agents) – als PDF und Word.
